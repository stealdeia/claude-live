name: ClaudeLiveMobile

options:
  bundleIdPrefix: it.aldeialab
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

packages:
  # The shared package. Linking it here is not a convenience: it is what proves
  # the extraction paid off, because the phone compiles the same models the Mac
  # uses rather than a copy of them.
  #
  # Points at the package itself, not at the repository root: the root package
  # depends on Sparkle, which is macOS-only, and resolving it from here would
  # download it on every clean checkout for nothing.
  ClaudeLiveKit:
    path: ../ClaudeLiveKit

targets:
  ClaudeLiveMobile:
    type: application
    platform: iOS
    sources:
      - ClaudeLiveMobile
    dependencies:
      - package: ClaudeLiveKit
        product: ClaudeLiveKit
      # L'estensione viaggia dentro l'app. Senza questa riga viene definita e
      # ignorata: il 2026-08-27 una build è andata su TestFlight senza l'isola
      # dentro, e «l'estensione compila» era falso — l'app non dipendeva da lei,
      # quindi quel comando non la compilava affatto.
      - target: ClaudeLiveActivity
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.aldeialab.ClaudeLiveMobile
        # Allineata a quella già caricata: App Store Connect non accetta una
        # versione più bassa della precedente, e l'Info.plist scritto a mano
        # diceva 1.0 mentre qui stava 0.1.0.
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "21"
        # The team the Apple Developer Program membership belongs to.
        DEVELOPMENT_TEAM: G7PDRQRC29
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      # APNs has two separate worlds and a token from one is meaningless in the
      # other. A build installed over the cable registers with the sandbox; one
      # that arrives through TestFlight or the App Store registers with
      # production. Hard-coding either one breaks the other, so it follows the
      # configuration — and the phone tells the relay which world it lives in.
      configs:
        Debug:
          APS_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production
    info:
      path: ClaudeLiveMobile/Info.plist
      properties:
        CFBundleDisplayName: Vibing Code Live
        # Collegate alle impostazioni, non scritte qui: XcodeGen mette un
        # `CFBundleVersion: 1` fisso come predefinito, che non ha alcun rapporto
        # con il numero di build — alzarlo nelle impostazioni non arrivava
        # nell'archivio, e App Store Connect rifiuta due volte lo stesso numero.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # La dichiarazione sull'esportazione, scritta qui invece di essere data a
        # mano a ogni caricamento. Senza, App Store Connect blocca la build su
        # «Missing Compliance» e nessuno può installarla finché qualcuno non apre
        # il pannello e risponde.
        #
        # Registra la risposta già data: l'app cifra con `ChaChaPoly` di
        # CryptoKit, cioè la crittografia del sistema operativo, e non
        # implementa né incorpora algoritmi propri — che nel questionario di
        # Apple è «nessuno degli algoritmi citati».
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        NSCameraUsageDescription: La fotocamera serve solo a inquadrare il codice di accoppiamento mostrato dal Mac.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Senza questa chiave l'app non può avviare nessuna Live Activity, e il
        # rifiuto arriva a tempo di esecuzione senza nominarla.
        NSSupportsLiveActivities: true
        # Aggiornamenti frequenti per notifica: senza, iOS concede un bilancio
        # ristretto e oltre quello scarta gli aggiornamenti in silenzio.
        NSSupportsLiveActivitiesFrequentUpdates: true
        # Lo schema con cui l'isola apre l'app nel punto giusto. Uno schema
        # proprio e non un indirizzo web: deve aprire *questa* app anche senza
        # rete, senza passare da un browser.
        CFBundleURLTypes:
          - CFBundleURLName: it.aldeialab.ClaudeLiveMobile
            CFBundleURLSchemes:
              - claudelive
    entitlements:
      path: ClaudeLiveMobile/ClaudeLiveMobile.entitlements
      properties:
        # Set from the configuration above rather than written here: Xcode expands
        # build settings inside entitlements, and this is the one value that must
        # differ between the build on the cable and the build people install.
        aps-environment: $(APS_ENVIRONMENT)
        # Il portachiavi condiviso con l'estensione dell'isola, che deve poter
        # aprire i contenuti sigillati che arrivano per notifica.
        #
        # L'identificativo dell'app viene **per primo**, e non è un dettaglio:
        # dichiarare dei gruppi cambia quello predefinito, e il predefinito è dove
        # stanno le voci già scritte — l'accoppiamento di chi ha l'app installata.
        # Metterlo primo lo lascia dov'era.
        keychain-access-groups:
          - $(AppIdentifierPrefix)it.aldeialab.ClaudeLiveMobile
          - $(AppIdentifierPrefix)it.aldeialab.ClaudeLiveMobile.shared

  # L'isola dinamica e la schermata di blocco. Un bersaglio a sé perché gira in
  # un processo suo: il sistema disegna queste viste anche con l'app chiusa.
  ClaudeLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - ClaudeLiveActivity
    dependencies:
      - package: ClaudeLiveKit
        product: ClaudeLiveKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.aldeialab.ClaudeLiveMobile.activity
        PRODUCT_NAME: ClaudeLiveActivity
        # Le stesse dell'app, e non è una comodità: App Store Connect rifiuta un
        # archivio in cui l'estensione e l'app che la contiene dichiarano
        # versioni diverse.
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "21"
        DEVELOPMENT_TEAM: G7PDRQRC29
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
    info:
      path: ClaudeLiveActivity/Info.plist
      properties:
        CFBundleDisplayName: Vibing Code Live
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: ClaudeLiveActivity/ClaudeLiveActivity.entitlements
      properties:
        # Lo stesso gruppo dell'app: è l'unico modo per cui questa estensione
        # possa aprire una scatola sigillata dal Mac senza che la chiave passi
        # da nessun'altra parte.
        keychain-access-groups:
          - $(AppIdentifierPrefix)it.aldeialab.ClaudeLiveMobile.shared
