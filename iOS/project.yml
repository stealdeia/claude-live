name: ClaudeLiveMobile

options:
  bundleIdPrefix: it.aldeialab
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

packages:
  # The shared package. Linking it here is not a convenience: it is what proves
  # the extraction paid off, because the phone compiles the same models the Mac
  # uses rather than a copy of them.
  #
  # Points at the package itself, not at the repository root: the root package
  # depends on Sparkle, which is macOS-only, and resolving it from here would
  # download it on every clean checkout for nothing.
  ClaudeLiveKit:
    path: ../ClaudeLiveKit

targets:
  ClaudeLiveMobile:
    type: application
    platform: iOS
    sources:
      - ClaudeLiveMobile
    dependencies:
      - package: ClaudeLiveKit
        product: ClaudeLiveKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.aldeialab.ClaudeLiveMobile
        # Allineata a quella già caricata: App Store Connect non accetta una
        # versione più bassa della precedente, e l'Info.plist scritto a mano
        # diceva 1.0 mentre qui stava 0.1.0.
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "2"
        # The team the Apple Developer Program membership belongs to.
        DEVELOPMENT_TEAM: G7PDRQRC29
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      # APNs has two separate worlds and a token from one is meaningless in the
      # other. A build installed over the cable registers with the sandbox; one
      # that arrives through TestFlight or the App Store registers with
      # production. Hard-coding either one breaks the other, so it follows the
      # configuration — and the phone tells the relay which world it lives in.
      configs:
        Debug:
          APS_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production
    info:
      path: ClaudeLiveMobile/Info.plist
      properties:
        CFBundleDisplayName: Claude Live
        # Collegate alle impostazioni, non scritte qui: XcodeGen mette un
        # `CFBundleVersion: 1` fisso come predefinito, che non ha alcun rapporto
        # con il numero di build — alzarlo nelle impostazioni non arrivava
        # nell'archivio, e App Store Connect rifiuta due volte lo stesso numero.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # La dichiarazione sull'esportazione, scritta qui invece di essere data a
        # mano a ogni caricamento. Senza, App Store Connect blocca la build su
        # «Missing Compliance» e nessuno può installarla finché qualcuno non apre
        # il pannello e risponde.
        #
        # Registra la risposta già data: l'app cifra con `ChaChaPoly` di
        # CryptoKit, cioè la crittografia del sistema operativo, e non
        # implementa né incorpora algoritmi propri — che nel questionario di
        # Apple è «nessuno degli algoritmi citati».
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        NSCameraUsageDescription: La fotocamera serve solo a inquadrare il codice di accoppiamento mostrato dal Mac.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    entitlements:
      path: ClaudeLiveMobile/ClaudeLiveMobile.entitlements
      properties:
        # Set from the configuration above rather than written here: Xcode expands
        # build settings inside entitlements, and this is the one value that must
        # differ between the build on the cable and the build people install.
        aps-environment: $(APS_ENVIRONMENT)
