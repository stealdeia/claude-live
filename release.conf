# Distribution settings, read by build.sh and release.sh.
#
# Keeping them here rather than hardcoded in the scripts means the feed URL and
# the signing identity are stated once.

# GitHub account that owns the releases.
GH_OWNER="stealdeia"

# Repository that hosts the code, the DMGs and the Sparkle appcast. Must be
# **public**: release assets of a private repository need authentication to
# download, which Sparkle cannot provide.
GH_RELEASES_REPO="claude-live"

# Where the app looks for updates. Served raw from the releases repo.
SU_FEED_URL="https://raw.githubusercontent.com/stealdeia/claude-live/main/appcast.xml"

# Public half of the Sparkle EdDSA key pair. The private half lives in the login
# keychain ("Private key for signing Sparkle updates") — see README: losing it
# means already-installed copies can no longer be updated.
SU_PUBLIC_ED_KEY="FP2qce5lGnABn1b97VrNuYqJYqd+8tr4G+5lQi8TqwI="

# Code-signing identity.
#
# Two shapes are supported, and build.sh switches behaviour on the prefix:
#
#   "Developer ID Application: … (TEAMID)"  → hardened runtime + secure
#       timestamp, and package.sh notarises the result with Apple. This is the
#       distribution path: no Gatekeeper prompt for recipients.
#
#   anything else (e.g. a self-signed "Claude Live Dev")  → no hardened runtime,
#       no timestamp, no notarisation. Recipients must approve the app once via
#       System Settings → Privacy & Security → "Open Anyway".
#
# Find the exact string with:  security find-identity -v -p codesigning
SIGN_IDENTITY="Developer ID Application: Samuel Ravani (G7PDRQRC29)"

# Apple Developer Team ID (10 characters). Only used in messages and checks —
# the identity string above already carries it.
TEAM_ID="G7PDRQRC29"

# Name of the notarytool credential profile stored in the login keychain. Create
# it once with:
#
#   xcrun notarytool store-credentials "claude-live-notary" \
#     --apple-id "purpleheads2026@gmail.com" \
#     --team-id "<TEAM_ID>" \
#     --password "<app-specific password from appleid.apple.com>"
#
# An app-specific password is required: notarytool rejects the plain Apple ID
# password.
NOTARY_PROFILE="claude-live-notary"
